<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逐渐完善的预知眼 · 设置</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f8cff'/%3E%3Ccircle cx='12' cy='19' r='2.4' fill='white'/%3E%3Ccircle cx='22' cy='19' r='2.4' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#4f8cff" />
                  <stop offset="1" stop-color="#9b6bff" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#g)" />
              <path d="M8 14.5c2.8-3.4 6.1-5 11-5 2.7 0 4.6.6 5.9 1.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
              <circle cx="13" cy="18.5" r="2.3" fill="#fff" />
              <circle cx="21.5" cy="18.5" r="2.3" fill="#fff" />
              <path d="M12.5 24c2.3 1.4 4.8 1.4 7 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>逐渐完善的预知眼</strong>
            <small>evolution · 设置</small>
          </span>
        </div>

        <nav class="nav" id="nav" aria-label="设置导航"></nav>

        <div class="sidebar-foot">
          <div class="version-line">
            <span class="dot" id="side-dot"></span>
            <span id="side-version">v—</span>
          </div>
          <div class="side-path" id="side-path" title="">—</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1 id="page-title">概览</h1>
            <p id="page-desc">插件运行状态与常用入口。</p>
          </div>
          <div class="top-actions">
            <span class="pill" id="login-pill">读取中…</span>
            <button class="btn ghost" id="btn-reload" type="button" title="重新拉取状态">刷新</button>
            <button class="btn primary" id="btn-save" type="button" disabled>保存更改</button>
          </div>
        </header>

        <div class="alert" id="alert" role="alert" hidden></div>

        <div class="views" id="views">
          <section class="view" data-view="overview" id="view-overview"></section>
          <section class="view" data-view="login" id="view-login" hidden></section>
          <div id="settings-views"></div>
          <section class="view" data-view="cache" id="view-cache" hidden></section>
          <section class="view" data-view="diagnostics" id="view-diagnostics" hidden></section>
        </div>

        <footer class="savebar" id="savebar" hidden>
          <span class="dirty-note" id="dirty-note">有未保存的更改</span>
          <button class="btn ghost" id="btn-discard" type="button">放弃</button>
          <button class="btn primary" id="btn-save-2" type="button">保存更改</button>
        </footer>
      </main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title">确认操作</h3>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="modal-cancel" type="button" data-close="1">取消</button>
          <button class="btn danger" id="modal-ok" type="button">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
