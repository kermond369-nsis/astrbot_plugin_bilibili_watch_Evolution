name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: 离线单测 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 清洗与门控
        run: python tests/test_cleaners.py
      - name: ASR 后处理
        run: python tests/test_asr.py
      - name: 仓库一致性
        run: python tests/test_repo_hygiene.py
